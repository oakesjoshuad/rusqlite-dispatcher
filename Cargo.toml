[package]
name = "rusqlite-dispatcher"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.7.1"
async-trait = "0.1.89"
rusqlite = "0.37.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", default-features = false, features = ["rt-multi-thread", "sync", "macros", "time"] }
ulid = "1.1.0"
